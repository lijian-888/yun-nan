# Append after the trial overrides. Keeps public authentication on the domain
# even when an older private deployment .env still names the backend IP.
services:
  api:
    environment:
      KEYCLOAK_ISSUER: https://longyun-yn.e-farmer.cn/auth/realms/rice-research
      CORS_ALLOWED_ORIGINS: https://longyun-yn.e-farmer.cn,https://172.16.123.193:19443
      TRUSTED_HOSTS: longyun-yn.e-farmer.cn,172.16.123.193,api,web,localhost,127.0.0.1
  keycloak:
    environment:
      KC_HOSTNAME: https://longyun-yn.e-farmer.cn/auth
      PUBLIC_PLATFORM_URL: https://longyun-yn.e-farmer.cn
  web:
    image: ${YNAAS_DOMAIN_WEB_IMAGE:-ynaas-trial-web:pedigree-depth-cap-20261016}
    build:
      args:
        VITE_KEYCLOAK_URL: https://longyun-yn.e-farmer.cn/auth
