# 193 共享主机上的云南试用版专用覆盖配置。
# 与 docker-compose.lan.yml 一起使用；不要单独执行本文件。
# COMPOSE_PROJECT_NAME=ynaas-trial 使网络、卷和容器与现有项目隔离。
services:
  db:
    # Match the pgvector version in the 2026-10-08 source database backup.
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ynaas_rice_ai
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rice -d ynaas_rice_ai"]
    mem_limit: 2g
    cpus: 2

  minio:
    mem_limit: 512m
    cpus: 1

  api:
    image: ynaas-trial-api:${RELEASE_TAG:-trial}
    environment:
      DATABASE_URL: postgresql+psycopg://ynaas_longyun_api:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@db:5432/ynaas_rice_ai
      MIGRATION_DATABASE_URL: postgresql+psycopg://rice:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/ynaas_rice_ai
      APP_DATABASE_ROLE: ynaas_longyun_api
      INSTITUTION_DATA_ENABLED: "false"
      DEMO_DATA_ENABLED: "false"
    mem_limit: 4g
    cpus: 3

  web:
    image: ynaas-trial-web:${RELEASE_TAG:-trial}
    mem_limit: 256m
    cpus: 0.5

  # First trial needs existing genotype queries, not batch genotype imports.
  # This worker can be explicitly enabled under its profile when required.
  genotype-worker:
    image: ynaas-trial-api:${RELEASE_TAG:-trial}
    profiles: [genotype-import]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://rice:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/ynaas_rice_ai
    mem_limit: 1g
    cpus: 1

  mineru:
    image: ynaas-trial-mineru:${RELEASE_TAG:-trial}
    mem_limit: 2g
    cpus: 2

  keycloak:
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/ynaas_rice_ai
      JAVA_OPTS_APPEND: -Xms256m -Xmx1024m
    mem_limit: 1536m
    cpus: 1

  gateway:
    mem_limit: 128m
    cpus: 0.25

  mineru-model-warmup:
    image: ynaas-trial-mineru:${RELEASE_TAG:-trial}

  model-warmup:
    image: ynaas-trial-api:${RELEASE_TAG:-trial}
